plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"betterimage2map" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

repositories {
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "com.twelvemonkeys.imageio:imageio-webp:3.15.2"
	include "com.twelvemonkeys.imageio:imageio-webp:3.15.2"
	include "com.twelvemonkeys.imageio:imageio-core:3.15.2"
	include "com.twelvemonkeys.imageio:imageio-metadata:3.15.2"
	include "com.twelvemonkeys.common:common-lang:3.15.2"
	include "com.twelvemonkeys.common:common-io:3.15.2"
	include "com.twelvemonkeys.common:common-image:3.15.2"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

base {
	archivesName = "BetterImage2Map"
}

jar {
	from("LICENSE") {
		rename { "${it}_BetterImage2Map" }
	}
}
